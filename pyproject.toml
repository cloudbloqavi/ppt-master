[tool.pyright]
include = [
    "core-ppt-master-engine/skills/ppt-master/scripts",
    "agent_runner",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
extraPaths = [
    "core-ppt-master-engine/skills/ppt-master/scripts",
    "core-ppt-master-engine/skills/ppt-master/scripts/image_backends",
    "core-ppt-master-engine/skills/ppt-master/scripts/image_sources",
    "core-ppt-master-engine/skills/ppt-master/scripts/pptx_to_svg",
    "core-ppt-master-engine/skills/ppt-master/scripts/source_to_md",
    "core-ppt-master-engine/skills/ppt-master/scripts/svg_editor",
    "core-ppt-master-engine/skills/ppt-master/scripts/svg_finalize",
    "core-ppt-master-engine/skills/ppt-master/scripts/svg_to_pptx"
]
pythonVersion = "3.10"
useLibraryCodeForTypes = true

# The Google Antigravity SDK ships partial/loose stubs whose ToolCall /
# ToolResult / StreamChunk union types trigger many false-positive
# attribute-access errors. Silence that noise so real bugs (possibly-unbound
# variables, undefined names) stay visible. cairosvg/pubsub_v1 are optional
# runtime deps not installed in every dev env.
reportAttributeAccessIssue = "none"
reportMissingImports = "warning"
# Keep the checks that actually catch UnboundLocalError-class bugs loud:
reportPossiblyUnboundVariable = "error"
reportUnboundVariable = "error"
