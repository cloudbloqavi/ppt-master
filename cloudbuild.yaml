# ─────────────────────────────────────────────────────────────
# PPT Master — Google Cloud Build Pipeline
# ─────────────────────────────────────────────────────────────
#
# Builds the Docker image, pushes it to Artifact Registry, and
# creates or updates a Cloud Run Job. GEMINI_API_KEY is pulled
# directly from Secret Manager at both build time (for the job
# binding) and Cloud Run Job runtime — never stored in source.
#
# Trigger setup (run once per environment):
#   gcloud builds triggers create github \
#     --project=$PROJECT_ID \
#     --repo-name=ppt-master \
#     --repo-owner=<github-org-or-user> \
#     --branch-pattern="^main$" \
#     --build-config=cloudbuild.yaml \
#     --substitutions="\
#       _REGION=us-central1,\
#       _GAR_REPOSITORY=ppt-master,\
#       _CLOUD_RUN_JOB_NAME=ppt-master-agent,\
#       _OUTPUT_ARTIFACTS_DIR=/workspace/outputs,\
#       _GEMINI_SECRET_NAME=gemini-api-key"
#
# Manual one-off build:
#   gcloud builds submit . \
#     --config=cloudbuild.yaml \
#     --project=$PROJECT_ID \
#     --substitutions="\
#       _REGION=us-central1,\
#       _GAR_REPOSITORY=ppt-master,\
#       _CLOUD_RUN_JOB_NAME=ppt-master-agent,\
#       _OUTPUT_ARTIFACTS_DIR=/workspace/outputs,\
#       _GEMINI_SECRET_NAME=gemini-api-key"
#
# Required IAM roles for the Cloud Build Service Account
# (PROJECT_NUMBER@cloudbuild.gserviceaccount.com):
#   roles/artifactregistry.writer       — push images
#   roles/run.admin                     — create/update Cloud Run Jobs
#   roles/secretmanager.secretAccessor  — read GEMINI_API_KEY at deploy time
#   roles/iam.serviceAccountUser        — act as the Cloud Run runtime SA
# ─────────────────────────────────────────────────────────────

# User-configurable substitutions (set in trigger or --substitutions flag).
# These are NOT secrets — they are plain configuration values.
substitutions:
  _REGION: us-central1
  _GAR_REPOSITORY: ppt-master
  _CLOUD_RUN_JOB_NAME: ppt-master-agent
  _OUTPUT_ARTIFACTS_DIR: /workspace/outputs
  _GEMINI_SECRET_NAME: gemini-api-key   # Secret Manager secret name (not the value)

# Expose GEMINI_API_KEY from Secret Manager to Cloud Build steps that need it.
# The secret VALUE is never written to substitutions or logs.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/$_GEMINI_SECRET_NAME/versions/latest
      env: GEMINI_API_KEY

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── Step 1: Build the Docker image ──────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPOSITORY/ppt-master-agent:$COMMIT_SHA
      - --tag
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPOSITORY/ppt-master-agent:latest
      - --label
      - git-commit=$COMMIT_SHA
      - --label
      - built-by=cloud-build
      - --cache-from
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPOSITORY/ppt-master-agent:latest
      - .

  # ── Step 2: Push both image tags to Artifact Registry ───────
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPOSITORY/ppt-master-agent:$COMMIT_SHA
    waitFor: [build]

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPOSITORY/ppt-master-agent:latest
    waitFor: [build]

  # ── Step 3: Create or update the Cloud Run Job ──────────────
  # GEMINI_API_KEY is bound to the job from Secret Manager at deploy time.
  # The secret value is never passed as a plain env var.
  - id: deploy-cloudrun-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        IMAGE="$_REGION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPOSITORY/ppt-master-agent:$COMMIT_SHA"
        JOB_NAME="$_CLOUD_RUN_JOB_NAME"
        REGION="$_REGION"

        echo "Checking if Cloud Run Job '$JOB_NAME' exists..."
        if gcloud run jobs describe "$JOB_NAME" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --quiet > /dev/null 2>&1; then
          OPERATION="update"
        else
          OPERATION="create"
        fi

        echo "Running: gcloud run jobs $OPERATION $JOB_NAME"

        gcloud run jobs $OPERATION "$JOB_NAME" \
          --image="$IMAGE" \
          --region="$REGION" \
          --project="$PROJECT_ID" \
          --task-timeout=3600 \
          --max-retries=1 \
          --memory=4Gi \
          --cpu=2 \
          --set-secrets="GEMINI_API_KEY=$_GEMINI_SECRET_NAME:latest" \
          --set-env-vars="OUTPUT_ARTIFACTS_DIR=$_OUTPUT_ARTIFACTS_DIR" \
          --quiet

        echo ""
        echo "════════════════════════════════════════"
        echo "  Deployment complete"
        echo "  Job:    $JOB_NAME"
        echo "  Region: $REGION"
        echo "  Image:  $IMAGE"
        echo ""
        echo "  To execute the job:"
        echo "  gcloud run jobs execute $JOB_NAME \\"
        echo "    --region $REGION \\"
        echo '    --args="--prompt,Your prompt here" \\'
        echo "    --wait"
        echo "════════════════════════════════════════"
    waitFor: [push-sha, push-latest]
    secretEnv: [GEMINI_API_KEY]   # available inside this step if needed for validation

# Final image published to Artifact Registry
images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPOSITORY/ppt-master-agent:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPOSITORY/ppt-master-agent:latest
